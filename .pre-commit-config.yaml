# Optional. With the pre-commit framework installed: `pre-commit install`.
# Without it, install scripts/pre-commit.sh as .git/hooks/pre-commit: it runs this check and the
# scope guard (install line at the top of that file).
repos:
  - repo: local
    hooks:
      - id: check-home-paths
        name: reject added home-directory paths
        entry: python tools/check_home_paths.py --staged
        language: system
        pass_filenames: false
        always_run: true
